<text x="32.0" y="44.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0F1B2D" text-anchor="start">Tres formas en que un modelo puede llevar personas dentro</text>
<text x="32.0" y="70.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5F6979" text-anchor="start">Un modelo puede ocupar menos que su tabla de entrenamiento y aun así revelar filas individuales.</text>
<rect x="28.0" y="96.0" width="310.0" height="254.0" rx="10" fill="#FDFCF9" stroke="#E2DFD6" stroke-width="1.5"/>
<text x="44.0" y="124.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" text-anchor="start">Vecinos más cercanos</text>
<text x="44.0" y="148.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">Guarda todas las filas de entrenamiento;</text>
<text x="44.0" y="164.9" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">predecir es buscarlas. Demo: 500 de 500</text>
<text x="44.0" y="181.8" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">filas, fichero 1,01x la tabla.</text>
<rect x="345.0" y="96.0" width="310.0" height="254.0" rx="10" fill="#FDFCF9" stroke="#E2DFD6" stroke-width="1.5"/>
<text x="361.0" y="124.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" text-anchor="start">Clasificador de vectores soporte</text>
<text x="361.0" y="148.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">Conserva las filas cercanas a la frontera.</text>
<text x="361.0" y="164.9" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">Demo: 423 de 500 filas guardadas como</text>
<text x="361.0" y="181.8" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">vectores soporte.</text>
<rect x="662.0" y="96.0" width="310.0" height="254.0" rx="10" fill="#FDFCF9" stroke="#E2DFD6" stroke-width="1.5"/>
<text x="678.0" y="124.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0F1B2D" text-anchor="start">Árbol de decisión profundo</text>
<text x="678.0" y="148.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">Divide hasta que una hoja contiene a una</text>
<text x="678.0" y="164.9" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">persona. Demo: hoja mínima de 1 fila, en 18</text>
<text x="678.0" y="181.8" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3A4556" text-anchor="start">KB frente a una tabla de 68 KB.</text>
